
<!DOCTYPE html>
<html>
<head>
    <title>Book Cover</title>

    <style>
        #h1 {
            color: aliceblue;
            font-size: large;
            font-family: Arial, sans-serif;
        }

        #h2 {
            color: aliceblue;
            font-size: large;
            font-family: Arial, sans-serif;
        }

        #p {
            color: aliceblue;
        }

        #h3 {
            color: floralwhite;
            font-size: larger;
        }

         img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            margin: 15px;
        }
    </style>
</head>

<body>

    <div style="
                height:400px;
                background:linear-gradient(135deg, #14213d, #000814);
                text-align:center;
                padding:20px;">

        <h1 id="h1">My Book</h1>

        <h2 id="h2">The World of Knowledge</h2>

        <p id="p">A Journey of Learning</p>

        <img src="EXP-5.jpg" alt="Book Cover">


        <br><br><br>

        <h3 id="h3">Author: Mari</h3>

    </div>

</body>
</html>
